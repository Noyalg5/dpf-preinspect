# Discrete-event line model. All rates and capacities are ASSUMPTIONS for
# illustration; replace with time studies from the real line.
horizon_days: 20
warmup_days: 2
replications: 5
arrivals:
  units_per_day: 60          # Poisson arrivals, continuous operation
resources:
  oven_slots: 24             # e.g. 6 bake ovens holding 4 units each, running around the clock
  test_benches: 1
  inspectors: 1
  pre_inspection_stations: 1
times_min:
  pre_inspection: 3.0
  standard_bake: 360.0
  extended_bake: 600.0
  pneumatic_clean: 15.0
  downstream_test: 12.0
  refer_review: 6.0
  quarantine_review: 10.0
tornado:
  replications: 2
  scrap_capture: [0.6, 0.98]
  false_quarantine_rate: [0.0, 0.05]
  arrivals_per_day: [45, 66]
  standard_clean_cost: [40.0, 70.0]
  wrongful_scrap_value: [400.0, 900.0]
  refer_false_scrap: [0.0, 0.10]
