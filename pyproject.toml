[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "preinspect"
version = "0.1.0"
description = "Vision pre-inspection and downstream-outcome prediction for diesel particulate filters (research prototype, synthetic data)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Noyal George" }]
dependencies = [
    "numpy>=1.26,<3",
    "pandas>=2.1",
    "pyarrow>=14",
    "pyyaml>=6",
    "scipy>=1.11",
    "opencv-python-headless>=4.8",
    "scikit-image>=0.22",
    "scikit-learn>=1.4",
    "torch>=2.2",
    "torchvision>=0.17",
    "captum>=0.7",
    "shap>=0.45",
    "statsmodels>=0.14",
    "simpy>=4.1",
    "typer>=0.12",
    "jinja2>=3.1",
    "matplotlib>=3.8",
    "onnx>=1.15",
    "onnxruntime>=1.17",
    "pydantic>=2.5",
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]
app = ["streamlit>=1.35"]

[project.scripts]
preinspect = "preinspect.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
preinspect = ["report/templates/*.j2", "report/templates/**/*.j2"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM", "NPY"]
ignore = ["N803", "N806", "N812", "B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning", "ignore::UserWarning"]
